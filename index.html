<!-- =======================================================================
     ▶ MISE EN LIGNE SUR GITHUB PAGES (obtenir un lien public)
     -----------------------------------------------------------------------

        · Nom       : chantier-pro

<!-- =======================================================================
     CHANTIER PRO — APPLICATION AUTONOME EN UN SEUL FICHIER
     -----------------------------------------------------------------------
     • Aucune dépendance externe (pas de CDN, pas de framework) :
       le fichier fonctionne en double-cliquant dessus ou sur GitHub Pages.
     • Stockage 100 % local via IndexedDB — 6 stores uniquement :
         projects · orders · deliveries · payments · services · expenses
     • Tous les indicateurs (tableau de bord, budgets, rapports, historique,
       statistiques) sont CALCULÉS dynamiquement : aucune table en plus.
     • L'application démarre VIDE. Les données de démonstration sont
       optionnelles (bouton dans ⚙️ Paramètres).
     -----------------------------------------------------------------------
     PLAN DU FICHIER
       1) CSS  : thèmes (apparence), barre latérale fluide, composants
       2) HTML : structure (sidebar, topbar, conteneur de page, modale)
       3) JS   : § A Utilitaires   § B IndexedDB   § C Calculs
                 § D Composants UI § E Pages       § F Formulaires
                 § G Import/Export § H Thèmes      § I Routeur / Démarrage
     ======================================================================= -->

<style>
/* =========================================================================
   1) THÈMES — toute l'apparence est pilotée par des variables CSS.
   data-theme  : clair | sombre | nuit | sable
   data-accent : bleu  | vert   | violet | orange | rouge
   ========================================================================= */
:root{
  --bg:#f1f5f9; --surface:#ffffff; --surface-2:#f8fafc; --border:#e2e8f0;
  --text:#0f172a; --muted:#64748b; --sidebar:#0f172a; --sidebar-text:#cbd5e1;
  --sidebar-active:#ffffff; --sidebar-active-text:#0f172a; --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
  --ok:#16a34a; --warn:#f59e0b; --danger:#e11d48; --radius:14px;
}
html[data-theme="sombre"]{
  --bg:#0b1220; --surface:#131c2e; --surface-2:#0f1829; --border:#24324a;
  --text:#e6edf7; --muted:#94a3b8; --sidebar:#080e1a; --sidebar-text:#93a4bd;
  --sidebar-active:#1e293b; --sidebar-active-text:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.5);
}
html[data-theme="nuit"]{
  --bg:#111111; --surface:#1b1b1b; --surface-2:#161616; --border:#2e2e2e;
  --text:#f3f4f6; --muted:#9ca3af; --sidebar:#000000; --sidebar-text:#a1a1aa;
  --sidebar-active:#27272a; --sidebar-active-text:#ffffff; --shadow:none;
}
html[data-theme="sable"]{
  --bg:#f6f1e7; --surface:#fffdf8; --surface-2:#f3ece0; --border:#e4d9c5;
  --text:#3b2f20; --muted:#8a7a63; --sidebar:#3b2f20; --sidebar-text:#e8dcc8;
  --sidebar-active:#fffdf8; --sidebar-active-text:#3b2f20;
}
html[data-accent="bleu"]  {--accent:#2563eb; --accent-2:#0ea5e9; --accent-contrast:#fff;}
html[data-accent="vert"]  {--accent:#16a34a; --accent-2:#059669; --accent-contrast:#fff;}
html[data-accent="violet"]{--accent:#7c3aed; --accent-2:#a855f7; --accent-contrast:#fff;}
html[data-accent="orange"]{--accent:#ea580c; --accent-2:#f59e0b; --accent-contrast:#fff;}
html[data-accent="rouge"] {--accent:#dc2626; --accent-2:#f43f5e; --accent-contrast:#fff;}

/* ------------------------------ Base ----------------------------------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.45;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,h4{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none !important}
.tabnum{font-variant-numeric:tabular-nums}

/* ============================ 1.a SIDEBAR FLUIDE =========================
   • Desktop : largeur animée 264px <-> 78px (mode icônes) — classe .mini
   • Mobile  : panneau hors écran animé par translateX — classe .open
   ========================================================================= */
.layout{display:flex;min-height:100vh}
.sidebar{
  width:264px; flex:0 0 264px; background:var(--sidebar); color:var(--sidebar-text);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; z-index:40;
  transition:width .28s cubic-bezier(.4,0,.2,1), flex-basis .28s cubic-bezier(.4,0,.2,1),
             transform .28s cubic-bezier(.4,0,.2,1), background .25s ease;
  overflow:hidden;
}
.sidebar.mini{width:78px;flex-basis:78px}
.brand{display:flex;align-items:center;gap:12px;padding:18px 18px 12px;white-space:nowrap}
.brand-logo{
  width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:20px;
}
.brand-txt{transition:opacity .2s ease}
.sidebar.mini .brand-txt{opacity:0;pointer-events:none}
.brand-txt b{display:block;font-size:14px;letter-spacing:.06em;color:#fff}
.brand-txt span{font-size:11px;opacity:.7}
.nav{padding:8px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1}
.nav a{
  display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:12px;
  color:var(--sidebar-text);text-decoration:none;font-weight:600;white-space:nowrap;
  transition:background .18s ease,color .18s ease,transform .18s ease;
}
.nav a .ic{flex:0 0 22px;display:grid;place-items:center;font-size:17px}
.nav a .lb{transition:opacity .2s ease}
.sidebar.mini .nav a .lb{opacity:0;width:0;overflow:hidden}
.nav a:hover{background:rgba(255,255,255,.08);transform:translateX(2px)}
.nav a.active{background:var(--sidebar-active);color:var(--sidebar-active-text)}
.sidebar-foot{padding:10px;border-top:1px solid rgba(255,255,255,.08)}
.collapse-btn{
  width:100%;min-height:42px;border:0;border-radius:12px;cursor:pointer;font-weight:700;
  background:rgba(255,255,255,.08);color:var(--sidebar-text);transition:background .18s ease;
}
.collapse-btn:hover{background:rgba(255,255,255,.16)}
.scrim{position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:35;opacity:0;pointer-events:none;transition:opacity .25s ease}
.scrim.show{opacity:1;pointer-events:auto}

/* --------------------------- Contenu principal -------------------------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:10px 14px;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
}
.page{padding:18px 14px 40px;max-width:1500px;width:100%;margin:0 auto}
.page-head{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.page-head h1{font-size:22px;font-weight:800}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13px}

/* ------------------------------ Composants ------------------------------ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card>header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.card>header h2{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .body{padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.kpi{border-radius:var(--radius);padding:14px;color:#fff;box-shadow:var(--shadow);background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.kpi.g{background:linear-gradient(135deg,#059669,#16a34a)}
.kpi.o{background:linear-gradient(135deg,#f59e0b,#ea580c)}
.kpi.r{background:linear-gradient(135deg,#e11d48,#be123c)}
.kpi.d{background:linear-gradient(135deg,#334155,#0f172a)}
.kpi.v{background:linear-gradient(135deg,#7c3aed,#a855f7)}
.kpi small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.85;font-weight:700}
.kpi b{display:block;font-size:19px;margin-top:4px;word-break:break-word}
.kpi i{display:block;font-style:normal;font-size:11px;opacity:.85;margin-top:3px}
.stat{border:1px solid var(--border);background:var(--surface-2);border-radius:12px;padding:12px}
.stat small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.stat b{font-size:17px}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
.r{text-align:right}
tfoot td,tr.total td{font-weight:800;background:var(--surface-2)}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}

.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;background:var(--surface-2);border:1px solid var(--border)}
.badge.ok{background:rgba(22,163,74,.14);color:var(--ok);border-color:transparent}
.badge.warn{background:rgba(245,158,11,.16);color:#b45309;border-color:transparent}
.badge.bad{background:rgba(225,29,72,.14);color:var(--danger);border-color:transparent}
.badge.info{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border-color:transparent}
.bar{height:8px;border-radius:999px;background:var(--border);min-width:70px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .4s ease}
.bar.full>span{background:var(--ok)} .bar.low>span{background:var(--warn)}

.btn{
  display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:11px;border:1px solid transparent;
  background:var(--accent);color:var(--accent-contrast);font-weight:700;cursor:pointer;
  transition:transform .12s ease,filter .18s ease,background .18s ease;
}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--text)}
.btn.soft{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.btn.danger{background:var(--danger)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}

/* ---- Boutons d'action ICÔNES (colonne « Actions ») ---- */
.actions{display:flex;gap:6px;justify-content:flex-end}
.iconbtn{
  width:34px;height:34px;display:grid;place-items:center;border-radius:10px;cursor:pointer;
  border:1px solid var(--border);background:var(--surface-2);color:var(--muted);
  transition:background .16s ease,color .16s ease,transform .16s ease,border-color .16s ease;
}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:hover{transform:translateY(-1px)}
.iconbtn.view:hover{color:var(--accent);border-color:var(--accent)}
.iconbtn.edit:hover{color:#2563eb;border-color:#2563eb}
.iconbtn.pay:hover{color:var(--ok);border-color:var(--ok)}
.iconbtn.del:hover{color:var(--danger);border-color:var(--danger)}
.iconbtn[data-tip]{position:relative}
.iconbtn[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);right:0;white-space:nowrap;
  background:var(--text);color:var(--surface);font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;z-index:5;
}

.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{
  width:100%;min-height:40px;padding:8px 11px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface);transition:border-color .16s ease,box-shadow .16s ease;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{min-height:76px;resize:vertical}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.filters .field{margin:0;min-width:150px}
.filters .field.grow{flex:1;min-width:190px}

.modal{position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .2s ease}
.modal.show{opacity:1;pointer-events:auto}
.modal .box{width:100%;max-width:760px;background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(2,6,23,.35);transform:translateY(-12px);transition:transform .22s ease}
.modal.show .box{transform:none}
.modal .box.wide{max-width:1040px}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal header h3{font-size:16px;font-weight:800}
.modal .content{padding:16px;max-height:72vh;overflow-y:auto}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.formgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.formgrid .full{grid-column:1/-1}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);background:var(--text);color:var(--surface);
  padding:10px 18px;border-radius:12px;font-weight:700;z-index:80;opacity:0;pointer-events:none;transition:all .25s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
.searchbox{position:relative;flex:1;min-width:190px}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;box-shadow:var(--shadow);max-height:330px;overflow-y:auto;z-index:50}
.results button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border)}
.results button:hover{background:var(--surface-2)}
.results small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:800}
.results i{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.linetitle{font-weight:700} .sub{display:block;font-size:11px;color:var(--muted)}
.matline{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));align-items:center;border:1px solid var(--border);border-radius:12px;padding:8px;margin-bottom:8px}
.report .sect{margin-bottom:20px}
.report .sect h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:8px}
.line{display:flex;justify-content:space-between;gap:16px;padding:4px 0;border-bottom:1px dashed var(--border);font-size:13px}
.line span{color:var(--muted)} .line b{font-variant-numeric:tabular-nums}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:50%;border:2px solid var(--border);cursor:pointer;transition:transform .15s ease}
.swatch:hover{transform:scale(1.08)} .swatch.on{border-color:var(--text);transform:scale(1.12)}
.themecard{border:2px solid var(--border);border-radius:12px;padding:10px;cursor:pointer;background:var(--surface-2);font-weight:700;transition:border-color .16s ease}
.themecard.on{border-color:var(--accent)}
.legend{list-style:none;margin:0;padding:0;font-size:13px}
.legend li{display:flex;align-items:center;gap:8px;padding:3px 0}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend .v{margin-left:auto;font-weight:700}

/* ------------------------------ Responsive ------------------------------ */
@media (max-width:1024px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.35)}
  .sidebar.open{transform:translateX(0)}
  .sidebar.mini{width:264px;flex-basis:264px}
  .sidebar.mini .brand-txt,.sidebar.mini .nav a .lb{opacity:1;width:auto}
  .page{padding:14px 10px 40px}
}
@media (max-width:640px){
  .page-head{align-items:stretch}
  .actions{justify-content:flex-start}
  .modal{padding:8px}
}
@media print{
  .sidebar,.topbar,.no-print,.scrim{display:none !important}
  body{background:#fff}.card{box-shadow:none;border:0}.page{padding:0}
}
</style>
</head>

<!-- =======================================================================
     2) STRUCTURE HTML
     ======================================================================= -->
<div class="layout">

  <!-- ----------------------- Barre latérale fluide ---------------------- -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">🏗️</div>
      <div class="brand-txt"><b>CHANTIER PRO</b><span>Gestion &amp; suivi</span></div>
    </div>
    <nav class="nav" id="nav"><!-- rempli par JS --></nav>
    <div class="sidebar-foot">
      <button class="collapse-btn" id="collapseBtn" title="Réduire / agrandir le menu">⇤</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ---------------------------- Zone centrale -------------------------- -->
  <div class="main">
    <header class="topbar no-print">
      <button class="iconbtn" id="burger" data-tip="Menu" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>

      <div class="searchbox">
        <input id="search" type="search" placeholder="🔍 Rechercher : fournisseur, commande, matériau, paiement, prestation…" />
        <div class="results hidden" id="results"></div>
      </div>

      <select id="projectPicker" style="max-width:240px"></select>

      <button class="iconbtn" id="themeBtn" data-tip="Apparence" aria-label="Apparence">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
    </header>

    <main class="page" id="page"><!-- rempli par JS --></main>
  </div>
</div>

<!-- Modale générique (formulaires, confirmations, aperçus) -->
<div class="modal" id="modal">
  <div class="box" id="modalBox">
    <header><h3 id="modalTitle">Titre</h3>
      <button class="iconbtn" id="modalClose" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </header>
    <div class="content" id="modalContent"></div>
    <footer id="modalFooter"></footer>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================================
   § A — UTILITAIRES GÉNÉRAUX
   ========================================================================= */

/** Raccourcis DOM */
const $  = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];

/** Échappement HTML (sécurité de l'affichage des saisies) */
const esc = (v)=> String(v==null?"":v).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/** Nombre sûr */
const num = (v)=> { const n = Number(v); return Number.isFinite(n) ? n : 0; };

/** Dates */
const todayISO = ()=> new Date().toISOString().slice(0,10);
const fDate = (d)=> { if(!d) return "—"; const x=new Date(d); return isNaN(x) ? d : x.toLocaleDateString("fr-FR"); };

/** Devises : codes ISO pour l'affichage (aucune conversion n'est faite) */
const ISO = { KMF:"KMF", EUR:"EUR", USD:"USD", CFA:"XOF" };
function fMoney(v, cur){
  cur = cur || currentCurrency();
  try{ return new Intl.NumberFormat("fr-FR",{style:"currency",currency:ISO[cur]||"EUR",maximumFractionDigits:2,minimumFractionDigits:0}).format(num(v)); }
  catch(e){ return fNum(v)+" "+cur; }
}
const fNum = (v,d=2)=> new Intl.NumberFormat("fr-FR",{maximumFractionDigits:d}).format(num(v));
const fPct = (v)=> fNum(v,2)+" %";

/** Pourcentage protégé contre la division par zéro */
const pct = (part,total)=> total ? (num(part)/num(total))*100 : 0;

/** Somme d'un tableau de nombres */
const sum = (arr)=> arr.reduce((s,v)=> s+num(v), 0);

/** Normalisation (comparaison insensible à la casse et aux accents) */
const norm = (s)=> String(s==null?"":s).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

/* =========================================================================
   § B — INDEXEDDB : 6 STORES UNIQUEMENT
   projects · orders · deliveries · payments · services · expenses
   Relations par identifiants :
     orders.projetId · deliveries.projetId/commandeId
     payments.projetId/referenceId · services.projetId · expenses.projetId
   ========================================================================= */
const STORES = ["projects","orders","deliveries","payments","services","expenses"];
const DB_NAME = "chantier-pro", DB_VERSION = 1;
let _db = null;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      STORES.forEach(s=>{ if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:"id",autoIncrement:true}); });
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror   = ()=> reject(req.error);
  });
}
async function db(){ if(!_db) _db = await openDB(); return _db; }

/** Lecture de tous les enregistrements d'un store */
async function dbAll(store){
  const d = await db();
  return new Promise((res)=>{ const r = d.transaction(store,"readonly").objectStore(store).getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>res([]); });
}
/** Ajout (id auto) */
async function dbAdd(store,obj){
  const d = await db();
  return new Promise((res,rej)=>{ const tx=d.transaction(store,"readwrite"); const r=tx.objectStore(store).add(obj); r.onsuccess=()=>res(r.result); tx.onerror=()=>rej(tx.error); });
}
/** Mise à jour (l'objet contient son id) */
async function dbPut(store,obj){
  const d = await db();
  return new Promise((res,rej)=>{ const tx=d.transaction(store,"readwrite"); tx.objectStore(store).put(obj); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); });
}
/** Suppression */
async function dbDel(store,id){
  const d = await db();
  return new Promise((res)=>{ const tx=d.transaction(store,"readwrite"); tx.objectStore(store).delete(id); tx.oncomplete=()=>res(); });
}
/** Vidage d'un store */
async function dbClear(store){
  const d = await db();
  return new Promise((res)=>{ const tx=d.transaction(store,"readwrite"); tx.objectStore(store).clear(); tx.oncomplete=()=>res(); });
}

const state = {

  projetId:null,            // projet actif (null = tous les projets)
  route:"dashboard",
  filters:{}                // filtres par page
};

/** Recharge les 6 stores depuis IndexedDB */
async function loadAll(){
  const res = await Promise.all(STORES.map(dbAll));
  STORES.forEach((s,i)=> state.data[s] = res[i]);
  // Si le projet actif n'existe plus, on repasse sur « tous les projets »
  if(state.projetId!=null && !state.data.projects.some(p=>p.id===state.projetId)) state.projetId = null;
}

const STATUTS_COMMANDE  = ["En cours","Livrée","Soldée","Annulée"];

/* =========================================================================
   § C — CALCULS (tout est dérivé des 6 tables, rien n'est stocké en double)
   ========================================================================= */

/** Données limitées au projet actif */
function scope(){
  const d = state.data;
  if(state.projetId==null) return d;
  const id = state.projetId;
  return {
    projects : d.projects.filter(p=>p.id===id),
    orders   : d.orders.filter(o=>o.projetId===id),
    deliveries:d.deliveries.filter(x=>x.projetId===id),
    payments : d.payments.filter(x=>x.projetId===id),
    services : d.services.filter(x=>x.projetId===id),
    expenses : d.expenses.filter(x=>x.projetId===id)
  };
}
/** Devise du projet actif (aucune conversion automatique) */
function currentCurrency(){
  const p = state.data.projects.find(p=>p.id===state.projetId) || state.data.projects[0];
  return p ? p.devise : "EUR";
}
/** Budget global d'un projet = matériaux + prestations + autres dépenses */
const budgetGlobal = (p)=> num(p.budgetMateriaux)+num(p.budgetPrestations)+num(p.budgetAutresDepenses);

/** Montant retenu pour une commande : le négocié s'il existe, sinon le commandé */
const montantDu = (o)=> num(o.montantNegocie)>0 ? num(o.montantNegocie) : num(o.montantCommande);

/** Total des lignes de matériaux : Σ (quantité × prix unitaire) */
const totalLignes = (o)=> sum((o.materiaux||[]).map(l=> num(l.quantite)*num(l.prixUnitaire)));

/**
 * Détail livraisons d'une commande, matériau par matériau :
 *   livré = Σ livraisons du même matériau · reste = commandé − livré · % = livré/commandé
 */
function lignesCommande(order, deliveries){
  return (order.materiaux||[]).map(l=>{
    const livree = sum(deliveries.filter(d=> d.commandeId===order.id && norm(d.materiau)===norm(l.designation)).map(d=>d.quantite));
    const commandee = num(l.quantite);
    return { l, commandee, livree, reste: commandee-livree, pourcent: pct(livree,commandee), montant: commandee*num(l.prixUnitaire) };
  });
}

/** Statistiques d'une commande (paiements + livraisons) */
function statOrder(order, payments, deliveries){
  const montant = montantDu(order);
  const paye    = sum(payments.filter(p=> p.type==="Fournisseur" && p.referenceId===order.id).map(p=>p.montant));
  const lignes  = lignesCommande(order, deliveries);
  const qc = sum(lignes.map(x=>x.commandee));
  const ql = sum(lignes.map(x=> Math.min(x.livree, x.commandee)));
  const statutLivraison = ql<=0 ? "Non livré" : (ql >= qc-1e-9 ? "Entièrement livré" : "Partiellement livré");
  return { order, montant, paye, reste: montant-paye, pourcentPaye: pct(paye,montant),
           qc, ql, pourcentLivre: pct(ql,qc), statutLivraison, lignes };
}

/** Statistiques d'une prestation : montant − Σ paiements de type « Prestation » */
function statService(s, payments){
  const montant = num(s.montantNegocie)>0 ? num(s.montantNegocie) : num(s.montantPrevu);
  const paye = sum(payments.filter(p=> p.type==="Prestation" && p.referenceId===s.id).map(p=>p.montant));
  const statutFinancier = paye<=0 ? "Non payé" : (paye>=montant-1e-9 ? "Entièrement payé" : "Partiellement payé");
  return { s, montant, paye, reste: montant-paye, pourcentPaye: pct(paye,montant), statutFinancier };
}

/** Agrégats globaux du périmètre courant (tableau de bord, budget, rapports) */
function computeStats(d){
  d = d || scope();
  const bM = sum(d.projects.map(p=>p.budgetMateriaux));
  const bP = sum(d.projects.map(p=>p.budgetPrestations));
  const bA = sum(d.projects.map(p=>p.budgetAutresDepenses));
  const bG = bM+bP+bA;

  const orders   = d.orders.map(o=> statOrder(o, d.payments, d.deliveries));
  const services = d.services.map(s=> statService(s, d.payments));

  const totalCommandes  = sum(orders.map(o=>o.montant));
  const payeFourn       = sum(d.payments.filter(p=>p.type==="Fournisseur").map(p=>p.montant));
  const totalPrest      = sum(services.map(s=>s.montant));
  const payePrest       = sum(d.payments.filter(p=>p.type==="Prestation").map(p=>p.montant));
  const payeAutres      = sum(d.payments.filter(p=>p.type==="Autre").map(p=>p.montant));
  const autresDepenses  = sum(d.expenses.map(e=>e.montant));

  // Dépenses réelles = paiements fournisseurs + paiements prestations + autres dépenses
  const depensesReelles = payeFourn + payePrest + autresDepenses + payeAutres;
  const qc = sum(orders.map(o=>o.qc)), ql = sum(orders.map(o=>o.ql));

  return { bM,bP,bA,bG, orders, services, totalCommandes, payeFourn, resteFourn: totalCommandes-payeFourn,
           totalPrest, payePrest, restePrest: totalPrest-payePrest, autresDepenses, payeAutres,
           depensesReelles, resteBudget: bG-depensesReelles, pourcentConsomme: pct(depensesReelles,bG),
           qc, ql, qr: qc-ql, pourcentLivraison: pct(ql,qc) };
}

/** Synthèse matériaux toutes commandes confondues */
function syntheseMateriaux(d){
  d = d || scope();
  const map = new Map();
  d.orders.forEach(o=> (o.materiaux||[]).forEach(l=>{
    const k = norm(l.designation);
    const cur = map.get(k) || {materiau:l.designation, unite:l.unite, commande:0, livre:0};
    cur.commande += num(l.quantite); map.set(k,cur);
  }));
  d.deliveries.forEach(x=>{
    const k = norm(x.materiau);
    const cur = map.get(k) || {materiau:x.materiau, unite:x.unite, commande:0, livre:0};
    cur.livre += num(x.quantite); map.set(k,cur);
  });
  return [...map.values()].map(m=> ({...m, reste:m.commande-m.livre, pourcent:pct(m.livre,m.commande)}))
                          .sort((a,b)=> a.materiau.localeCompare(b.materiau));
}

/** Historique chronologique — généré à partir des tables (pas de 7e table) */
function historique(d){
  d = d || scope();
  const ops = [];
  d.orders.forEach(o=> ops.push({date:o.dateCommande, type:"Commande", lib:o.numeroCommande+" — "+o.fournisseur, det:o.description||"", montant:montantDu(o)}));
  d.deliveries.forEach(x=> ops.push({date:x.dateLivraison, type:"Livraison", lib:x.materiau, det:x.numeroBon?("Bon "+x.numeroBon):(x.observation||""), qte:fNum(x.quantite)+" "+(x.unite||"")}));
  d.payments.forEach(p=> ops.push({date:p.datePaiement, type:"Paiement "+p.type.toLowerCase(), lib:p.beneficiaire, det:(p.natureVersement||"")+" · "+(p.modePaiement||""), montant:p.montant}));
  d.expenses.forEach(e=> ops.push({date:e.date, type:"Dépense", lib:e.categorie, det:e.description||"", montant:e.montant}));
  return ops.sort((a,b)=> (a.date<b.date?1:a.date>b.date?-1:0));
}

/** Identifiants automatiques : PRJ001 · CMD-2026-001 · LIV/PAY/PRE/DEP-… */
function maxSeq(values, prefix){
  let max=0; values.forEach(v=>{ if(v && String(v).startsWith(prefix)){ const m=String(v).match(/(\d+)\s*$/); if(m) max=Math.max(max,parseInt(m[1],10)); }});
  return max;
}
const nextProjectCode = ()=> "PRJ"+String(maxSeq(state.data.projects.map(p=>p.codeProjet),"PRJ")+1).padStart(3,"0");
function nextCode(prefix, values){
  const head = prefix+"-"+new Date().getFullYear()+"-";
  return head + String(maxSeq(values, head)+1).padStart(3,"0");
}

/** Graphique en barres (SVG-less, simple et léger) */
function barChart(items){
  const max = Math.max(1, ...items.map(i=>num(i.v)));
  return items.map(i=>
    '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:3px">'+
    '<span>'+esc(i.l)+'</span><span class="tabnum">'+esc(fMoney(i.v))+'</span></div>'+
    '<div class="bar" style="height:11px"><span style="width:'+pct(i.v,max)+'%;background:'+i.c+'"></span></div></div>'
  ).join("");
}

/** Graphique en anneau (SVG) + légende */
function donut(items, money){
  const total = sum(items.map(i=>i.v)); const R=54, C=2*Math.PI*R; let off=0;
  const arcs = items.map(i=>{
    const dash = (total? i.v/total : 0)*C;
    const el = '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+i.c+'" stroke-width="18" stroke-dasharray="'+dash+' '+(C-dash)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"></circle>';
    off += dash; return el;
  }).join("");
  const leg = items.map(i=> '<li><i style="background:'+i.c+'"></i>'+esc(i.l)+'<span class="v">'+(money?fMoney(i.v):fNum(i.v,0))+'</span><span style="color:var(--muted);width:62px;text-align:right">'+fPct(pct(i.v,total))+'</span></li>').join("");
  return '<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center">'+
    '<svg viewBox="0 0 140 140" style="width:150px;height:150px;flex:0 0 150px"><circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--border)" stroke-width="18"></circle>'+arcs+'</svg>'+
    '<ul class="legend" style="flex:1;min-width:190px">'+leg+'</ul></div>';
}

    '</tbody></table></div>';

  const tblFourn = s.orders.length ? '<div class="tablewrap"><table><thead><tr><th>Fournisseur</th><th>Commande</th><th class="r">Montant</th><th class="r">Payé</th><th class="r">Reste</th><th class="r">% payé</th></tr></thead><tbody>'+
    s.orders.map(o=> '<tr><td>'+esc(o.order.fournisseur)+'</td><td>'+esc(o.order.numeroCommande)+'</td><td class="r tabnum">'+fMoney(o.montant)+'</td>'+
      '<td class="r tabnum">'+fMoney(o.paye)+'</td><td class="r tabnum">'+fMoney(o.reste)+'</td><td class="r tabnum">'+fPct(o.pourcentPaye)+'</td></tr>').join("")+
    '<tr class="total"><td>TOTAL</td><td>—</td><td class="r tabnum">'+fMoney(s.totalCommandes)+'</td><td class="r tabnum">'+fMoney(s.payeFourn)+'</td><td class="r tabnum">'+fMoney(s.resteFourn)+'</td><td class="r tabnum">'+fPct(pct(s.payeFourn,s.totalCommandes))+'</td></tr>'+
    '</tbody></table></div>' : empty("Aucune commande.");

  const ops = historique(d).filter(o=> f.type==="Tous" || norm(o.type).includes(norm(f.type)));
  const tblHist = ops.length ? '<div class="tablewrap"><table><thead><tr><th>Date</th><th>Type</th><th>Libellé</th><th>Détail</th><th class="r">Montant / Qté</th></tr></thead><tbody>'+
    ops.map(o=> '<tr><td>'+fDate(o.date)+'</td><td>'+esc(o.type)+'</td><td>'+esc(o.lib)+'</td><td>'+esc(o.det||"—")+'</td><td class="r tabnum">'+(o.montant!=null?fMoney(o.montant):esc(o.qte||""))+'</td></tr>').join("")+
    '</tbody></table></div>' : empty("Aucune opération.");

  return pageHead("Budget","Budget prévu, dépenses réelles, écart et consommation.")+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi("Budget global", fMoney(s.bG),null,"d")+kpi("Dépenses réelles", fMoney(s.depensesReelles),null,"r")+
      kpi("Reste budget", fMoney(s.resteBudget),null,s.resteBudget<0?"r":"g")+kpi("% budget consommé", fPct(s.pourcentConsomme))+
    '</div>'+

    card("Suivi des paiements fournisseurs", tblFourn)+
    card("Historique complet des opérations", tblHist,
      '<div class="filters"><label class="field"><span>Type</span><select data-f="budget.type">'+opts(["Tous","Commande","Livraison","Paiement","Dépense"], f.type)+'</select></label></div>');

/* --------------------------------- Rapports ------------------------------- */
function pageRapports(){
  const d = scope(), s = computeStats(d);
  const f = state.filters.rapports || (state.filters.rapports = {type:"global",four:"Tous",cmd:"Toutes",du:"",au:""});
  const fournisseurs = [...new Set(d.orders.map(o=>o.fournisseur))].sort();
  const inPeriode = (x)=> (!f.du || x>=f.du) && (!f.au || x<=f.au);
  const projet = state.data.projects.find(p=>p.id===state.projetId);

  const filters = card("", '<div class="filters">'+
    '<label class="field"><span>Type de rapport</span><select data-f="rapports.type">'+
      '<option value="global"'+(f.type==="global"?" selected":"")+'>Rapport global du chantier</option>'+
      '<option value="fournisseur"'+(f.type==="fournisseur"?" selected":"")+'>Rapport fournisseur</option>'+
      '<option value="prestations"'+(f.type==="prestations"?" selected":"")+'>Rapport prestations</option></select></label>'+
    '<label class="field"><span>Fournisseur</span><select data-f="rapports.four">'+opts(["Tous"].concat(fournisseurs), f.four)+'</select></label>'+
    '<label class="field"><span>Commande</span><select data-f="rapports.cmd"><option value="Toutes">Toutes</option>'+
      d.orders.filter(o=> f.four==="Tous"||o.fournisseur===f.four).map(o=>'<option value="'+o.id+'"'+(f.cmd===String(o.id)?" selected":"")+'>'+esc(o.numeroCommande)+'</option>').join("")+'</select></label>'+
    '<label class="field"><span>Du</span><input type="date" data-f="rapports.du" value="'+esc(f.du)+'"></label>'+
    '<label class="field"><span>Au</span><input type="date" data-f="rapports.au" value="'+esc(f.au)+'"></label>'+
    resetBtn+'</div>');

  const head = '<header style="border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:14px">'+
    '<h2 style="font-size:19px">'+(f.type==="global"?"RAPPORT GLOBAL DU CHANTIER":f.type==="fournisseur"?"RAPPORT FOURNISSEUR":"RAPPORT DES PRESTATIONS")+'</h2>'+
    '<p class="sub">'+esc(projet? (projet.codeProjet+" · "+projet.nomProjet+" · "+(projet.localisation||"")) : "Tous les projets")+' — édité le '+fDate(todayISO())+'</p></header>';

  const L = (l,v)=> '<div class="line"><span>'+esc(l)+'</span><b>'+esc(v)+'</b></div>';
  const S = (t,c)=> '<div class="sect"><h3>'+esc(t)+'</h3>'+c+'</div>';
  let body = "";

  if(f.type==="fournisseur"){
    const cmds = d.orders.filter(o=> (f.four==="Tous"||o.fournisseur===f.four) && (f.cmd==="Toutes"||String(o.id)===f.cmd));
    body = cmds.length ? cmds.map(o=>{
      const st = statOrder(o, d.payments, d.deliveries);
      const liv = d.deliveries.filter(x=> x.commandeId===o.id && inPeriode(x.dateLivraison));
      const pay = d.payments.filter(p=> p.type==="Fournisseur" && p.referenceId===o.id && inPeriode(p.datePaiement));
      return S("Informations fournisseur", L("Nom",o.fournisseur)+L("Téléphone",o.telephoneFournisseur||"—")+L("Commande",o.numeroCommande+" ("+fDate(o.dateCommande)+")"))+
        S("Situation financière", L("Montant commande",fMoney(o.montantCommande))+L("Remise",fMoney(o.remise))+L("Montant négocié",fMoney(st.montant))+
          L("Total payé",fMoney(st.paye))+L("Reste à payer",fMoney(st.reste))+L("% payé",fPct(st.pourcentPaye)))+
        S("Matériaux", '<div class="tablewrap"><table><thead><tr><th>Matériau</th><th class="r">Commandée</th><th class="r">Livrée</th><th class="r">Restante</th><th class="r">% livré</th></tr></thead><tbody>'+
          st.lignes.map(x=>'<tr><td>'+esc(x.l.designation)+' ('+esc(x.l.unite||"")+')</td><td class="r tabnum">'+fNum(x.commandee)+'</td><td class="r tabnum">'+fNum(x.livree)+'</td><td class="r tabnum">'+fNum(x.reste)+'</td><td class="r tabnum">'+fPct(x.pourcent)+'</td></tr>').join("")+'</tbody></table></div>')+
        S("Historique des livraisons", liv.length? '<div class="tablewrap"><table><thead><tr><th>Date</th><th>Matériau</th><th class="r">Quantité</th><th>Bon</th></tr></thead><tbody>'+
          liv.map(x=>'<tr><td>'+fDate(x.dateLivraison)+'</td><td>'+esc(x.materiau)+'</td><td class="r tabnum">'+fNum(x.quantite)+' '+esc(x.unite||"")+'</td><td>'+esc(x.numeroBon||"—")+'</td></tr>').join("")+'</tbody></table></div>' : empty("Aucune livraison sur la période."))+
        S("Historique des paiements", pay.length? '<div class="tablewrap"><table><thead><tr><th>Date</th><th>Nature</th><th>Mode</th><th>Référence</th><th class="r">Montant</th></tr></thead><tbody>'+
          pay.map(p=>'<tr><td>'+fDate(p.datePaiement)+'</td><td>'+esc(p.natureVersement||"")+'</td><td>'+esc(p.modePaiement||"")+'</td><td>'+esc(p.reference||"—")+'</td><td class="r tabnum">'+fMoney(p.montant)+'</td></tr>').join("")+
          '<tr class="total"><td colspan="4">Total</td><td class="r tabnum">'+fMoney(sum(pay.map(p=>p.montant)))+'</td></tr></tbody></table></div>' : empty("Aucun paiement sur la période."));
    }).join('<hr style="border:0;border-top:1px dashed var(--border);margin:20px 0">') : empty("Aucune commande trouvée.");
  }
  else if(f.type==="prestations"){
    const rows = d.services.map(x=> statService(x,d.payments));
    body = S("Prestations", rows.length? '<div class="tablewrap"><table><thead><tr><th>Prestataire</th><th>Prestation</th><th>Dates</th><th class="r">Prévu</th><th class="r">Négocié</th><th class="r">Payé</th><th class="r">Reste</th><th>Statut</th></tr></thead><tbody>'+
      rows.map(x=>'<tr><td>'+esc(x.s.prestataire||"—")+'</td><td>'+esc(x.s.designation)+'</td><td>'+fDate(x.s.datePrevue)+' → '+(x.s.dateRealisation?fDate(x.s.dateRealisation):"—")+'</td>'+
        '<td class="r tabnum">'+fMoney(x.s.montantPrevu)+'</td><td class="r tabnum">'+fMoney(x.s.montantNegocie)+'</td><td class="r tabnum">'+fMoney(x.paye)+'</td><td class="r tabnum">'+fMoney(x.reste)+'</td>'+
        '<td>'+esc(x.statutFinancier)+' · '+esc(x.s.statut)+'</td></tr>').join("")+
      '<tr class="total"><td colspan="3">TOTAL</td><td class="r tabnum">'+fMoney(sum(rows.map(r=>r.s.montantPrevu)))+'</td><td class="r tabnum">'+fMoney(sum(rows.map(r=>r.montant)))+
      '</td><td class="r tabnum">'+fMoney(sum(rows.map(r=>r.paye)))+'</td><td class="r tabnum">'+fMoney(sum(rows.map(r=>r.reste)))+'</td><td></td></tr></tbody></table></div>' : empty("Aucune prestation."));
  }
  else {
    const mats = syntheseMateriaux(d);
    body =
      S("Informations du projet", L("Nom", projet?projet.nomProjet:"Tous les projets")+L("Propriétaire", projet?(projet.proprietaire||"—"):"—")+
        L("Localisation", projet?(projet.localisation||"—"):"—")+L("Dates", projet? (fDate(projet.dateDebut)+" → "+fDate(projet.dateFinPrevue)) : "—")+L("Statut", projet?projet.statut:"—"))+
      S("Situation budgétaire", L("Budget global",fMoney(s.bG))+L("Total payé",fMoney(s.depensesReelles))+L("Reste budget",fMoney(s.resteBudget))+L("% consommé",fPct(s.pourcentConsomme)))+
      S("Fournisseurs", L("Total commandes",fMoney(s.totalCommandes))+L("Total payé",fMoney(s.payeFourn))+L("Reste à payer",fMoney(s.resteFourn))+
        (s.orders.length? '<div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Fournisseur</th><th>Commande</th><th class="r">Montant</th><th class="r">Payé</th><th class="r">Reste</th><th class="r">% payé</th></tr></thead><tbody>'+
          s.orders.map(o=>'<tr><td>'+esc(o.order.fournisseur)+'</td><td>'+esc(o.order.numeroCommande)+'</td><td class="r tabnum">'+fMoney(o.montant)+'</td><td class="r tabnum">'+fMoney(o.paye)+'</td><td class="r tabnum">'+fMoney(o.reste)+'</td><td class="r tabnum">'+fPct(o.pourcentPaye)+'</td></tr>').join("")+'</tbody></table></div>':""))+
      S("Matériaux", L("Commandés",fNum(s.qc))+L("Livrés",fNum(s.ql))+L("Restants",fNum(s.qr))+L("% livré",fPct(s.pourcentLivraison))+
        (mats.length? '<div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Matériau</th><th class="r">Commandé</th><th class="r">Livré</th><th class="r">Reste</th><th class="r">%</th></tr></thead><tbody>'+
          mats.map(m=>'<tr><td>'+esc(m.materiau)+'</td><td class="r tabnum">'+fNum(m.commande)+'</td><td class="r tabnum">'+fNum(m.livre)+'</td><td class="r tabnum">'+fNum(m.reste)+'</td><td class="r tabnum">'+fPct(m.pourcent)+'</td></tr>').join("")+'</tbody></table></div>':""))+
      S("Prestations", L("Total prévu",fMoney(s.totalPrest))+L("Total payé",fMoney(s.payePrest))+L("Reste à payer",fMoney(s.restePrest)))+
      S("Autres dépenses", d.expenses.length? '<div class="tablewrap"><table><thead><tr><th>N°</th><th>Date</th><th>Catégorie</th><th>Description</th><th class="r">Montant</th></tr></thead><tbody>'+
        d.expenses.map(e=>'<tr><td>'+esc(e.numeroDepense||"—")+'</td><td>'+fDate(e.date)+'</td><td>'+esc(e.categorie)+'</td><td>'+esc(e.description||"")+'</td><td class="r tabnum">'+fMoney(e.montant)+'</td></tr>').join("")+
        '<tr class="total"><td colspan="4">TOTAL</td><td class="r tabnum">'+fMoney(s.autresDepenses)+'</td></tr></tbody></table></div>' : empty("Aucune dépense."))+
      S("Synthèse", L("Budget prévu",fMoney(s.bG))+L("Dépenses réelles",fMoney(s.depensesReelles))+L("Écart",fMoney(s.bG-s.depensesReelles))+L("% consommé",fPct(s.pourcentConsomme)));
  }

  return pageHead("Rapports","Rapport fournisseur, rapport prestations et rapport global du chantier.",
      '<button class="btn" data-act="print">'+ICONS.print+' Exporter en PDF</button>')+
    filters+'<section class="card report"><div class="body">'+head+body+'</div></section>';
}

/** Helper : construction d'options <select> */
function opts(list, selected){
  return list.map(o=>{ const v = (typeof o==="object")?o.v:o, l=(typeof o==="object")?o.l:o;
    return '<option value="'+esc(v)+'"'+(String(selected)===String(v)?" selected":"")+'>'+esc(l)+'</option>'; }).join("");

/** Construit un champ de formulaire */
function fld(label, html, full){ return '<label class="field'+(full?" full":"")+'"><span>'+esc(label)+'</span>'+html+'</label>'; }
const inp = (name,val,type,attrs)=> '<input name="'+name+'" type="'+(type||"text")+'" value="'+esc(val==null?"":val)+'" '+(attrs||"")+'>';
const sl  = (name,list,val)=> '<select name="'+name+'">'+opts(list,val)+'</select>';
const ta  = (name,val)=> '<textarea name="'+name+'">'+esc(val||"")+'</textarea>';

/** Liste des projets pour les sélecteurs (les formulaires exigent un projet) */
function projectOptions(){ return state.data.projects.map(p=>({v:p.id,l:p.codeProjet+" · "+p.nomProjet})); }

/** Récupère les valeurs saisies dans la modale */
function readForm(){
  const o = {};
  $$("#modalContent [name]").forEach(el=>{
    if(el.dataset.mat) return;                       // lignes de matériaux traitées à part
    o[el.name] = el.type==="number" ? num(el.value) : el.value;
  });
  return o;
}

function download(filename, content, mime){
  const url = URL.createObjectURL(new Blob([content], {type:mime+";charset=utf-8;"}));
  const a = document.createElement("a"); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
}
function toCSV(rows){
  if(!rows.length) return "";
  const headers = [...new Set(rows.flatMap(r=>Object.keys(r)))];
  const cell = (v)=> '"'+String(v==null?"":(typeof v==="object"?JSON.stringify(v):v)).replace(/"/g,'""')+'"';
  return [headers.join(";")].concat(rows.map(r=> headers.map(h=>cell(r[h])).join(";"))).join("\n");
}
function parseCSV(text){
  const lines = text.replace(/\r/g,"").split("\n").filter(Boolean); if(!lines.length) return [];
  const delim = lines[0].includes(";") ? ";" : ",";
  const split = (line)=>{ const out=[]; let cur="",q=false;
    for(let i=0;i<line.length;i++){ const c=line[i];
      if(c==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; }
      else if(c===delim && !q){ out.push(cur); cur=""; } else cur+=c; }
    out.push(cur); return out; };
  const headers = split(lines[0]).map(h=>h.trim());
  return lines.slice(1).map(l=>{ const c=split(l); const o={}; headers.forEach((h,i)=> o[h]=(c[i]||"").trim()); return o; });
}
/** Conversion des champs texte importés vers les bons types */
function coerce(entity, row){
  const o = Object.assign({}, row); delete o.id;
  ["projetId","commandeId","referenceId"].forEach(k=>{ if(k in o) o[k] = o[k]===""||o[k]==null?null:Number(o[k]); });
  ["budgetMateriaux","budgetPrestations","budgetAutresDepenses","montantCommande","remise","montantNegocie",
   "montant","montantPrevu","quantite","prixUnitaire"].forEach(k=>{ if(k in o) o[k]=num(o[k]); });
  if(entity==="orders"){ try{ o.materiaux = typeof o.materiaux==="string" ? JSON.parse(o.materiaux||"[]") : (o.materiaux||[]); }catch(e){ o.materiaux=[]; } }
  if(entity!=="projects" && !o.projetId && state.projetId!=null) o.projetId = state.projetId;
  o.dateCreation = o.dateCreation || new Date().toISOString();
  return o;
}
async function handleImportFile(entity, file){
  const text = await file.text(); let rows=[];
  try{
    if(/\.json$/i.test(file.name)){ const p = JSON.parse(text); rows = Array.isArray(p)? p : (p[entity]||[]); }
    else rows = parseCSV(text);
  }catch(err){ return toast("Fichier illisible (JSON ou CSV attendu)."); }
  if(!rows.length) return toast("Aucune ligne détectée.");

  // 1) vérification · 2) aperçu · 3) erreurs · 4) confirmation · 5) import
  const errs = [];
  rows.forEach((r,i)=>{
    if(entity==="projects" && !r.nomProjet) errs.push("Ligne "+(i+1)+" : nomProjet manquant");
    if(entity!=="projects" && !r.projetId && state.projetId==null) errs.push("Ligne "+(i+1)+" : projetId manquant");
    if(num(r.montant)<0) errs.push("Ligne "+(i+1)+" : montant négatif");
    if(num(r.quantite)<0) errs.push("Ligne "+(i+1)+" : quantité négative");
  });
  const headers = Object.keys(rows[0]);
  openModal("Aperçu de l'import — "+rows.length+" ligne(s)",
    (errs.length? '<div style="background:rgba(225,29,72,.1);color:var(--danger);padding:10px;border-radius:10px;max-height:120px;overflow:auto"><b>'+errs.length+' erreur(s)</b><ul style="margin:6px 0 0 16px">'+errs.slice(0,20).map(e=>'<li>'+esc(e)+'</li>').join("")+'</ul></div>'
              : '<p style="color:var(--ok)"><b>Aucune erreur détectée.</b></p>')+
    '<div class="tablewrap" style="max-height:340px;overflow:auto;margin-top:10px"><table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join("")+'</tr></thead><tbody>'+
    rows.slice(0,25).map(r=>'<tr>'+headers.map(h=>'<td>'+esc(typeof r[h]==="object"?JSON.stringify(r[h]):r[h])+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>'+
    '<p class="sub" style="margin-top:8px">L\'import est additif : aucune donnée existante ne sera supprimée.</p>',
    '<button class="btn ghost" data-close>Annuler</button><button class="btn" id="okImp">Confirmer l\'import</button>', true);

  $("#okImp").onclick = async ()=>{
    for(const r of rows) await dbAdd(entity, coerce(entity,r));
    closeModal(); await refresh(); toast(rows.length+" enregistrement(s) importé(s).");
  };
}
async function exportBackup(){
  const data = {}; for(const s of STORES) data[s] = await dbAll(s);
  download("sauvegarde-chantier-"+todayISO()+".json",
    JSON.stringify(Object.assign({version:1, exportedAt:new Date().toISOString()}, data), null, 2), "application/json");
  toast("Sauvegarde complète exportée.");
}
async function handleRestoreFile(file){
  let data; try{ data = JSON.parse(await file.text()); }catch(e){ return toast("Fichier de sauvegarde invalide."); }
  const counts = STORES.map(s=> s+" : "+((data[s]||[]).length)+" ligne(s)");
  confirmDelete("La restauration REMPLACERA toutes les données actuelles. "+counts.join(" · "), async ()=>{
    for(const s of STORES){ await dbClear(s); for(const row of (data[s]||[])) await dbPut(s,row); }
    await refresh(); toast("Sauvegarde restaurée.");
  }, "Restaurer");
}

/* --------------------------- Recherche globale ----------------------------- */
function globalSearch(q){
  const t = norm(q); if(t.length<2) return [];
  const d = state.data, out = [];
  const hit = (...p)=> norm(p.join(" ")).includes(t);
  d.projects.forEach(p=> hit(p.nomProjet,p.codeProjet,p.proprietaire,p.localisation) && out.push({c:"Projet",t:p.nomProjet,s:p.codeProjet+" · "+(p.localisation||""),r:"projets"}));
  d.orders.forEach(o=> hit(o.numeroCommande,o.fournisseur,o.description,(o.materiaux||[]).map(m=>m.designation).join(" ")) &&
    out.push({c:"Commande",t:o.numeroCommande+" — "+o.fournisseur,s:(o.materiaux||[]).map(m=>m.designation).join(", "),r:"commandes"}));
  d.deliveries.forEach(x=> hit(x.materiau,x.numeroBon,x.numeroLivraison) && out.push({c:"Livraison",t:x.materiau+" ("+fNum(x.quantite)+" "+(x.unite||"")+")",s:fDate(x.dateLivraison)+" "+(x.numeroBon||""),r:"livraisons"}));
  d.payments.forEach(p=> hit(p.beneficiaire,p.reference,p.numeroPaiement,p.type) && out.push({c:"Paiement",t:p.beneficiaire+" — "+fMoney(p.montant),s:p.type+" · "+fDate(p.datePaiement),r:"paiements"}));
  d.services.forEach(s=> hit(s.designation,s.prestataire,s.codePrestation,s.categorie) && out.push({c:"Prestation",t:s.designation+" — "+(s.prestataire||""),s:(s.codePrestation||"")+" · "+s.statut,r:"prestations"}));
  d.expenses.forEach(e=> hit(e.categorie,e.description,e.numeroDepense,e.beneficiaire) && out.push({c:"Dépense",t:e.categorie+" — "+(e.description||""),s:(e.numeroDepense||"")+" · "+fDate(e.date),r:"depenses"}));
  return out.slice(0,40);
}

/* ------------------------------- Événements -------------------------------- */
document.addEventListener("click", async (ev)=>{
  // Fermeture de la modale
  if(ev.target.closest("[data-close]") || ev.target.id==="modalClose"){ closeModal(); return; }
  if(ev.target.id==="modal"){ closeModal(); return; }

  const btn = ev.target.closest("[data-act]"); if(!btn) return;
  const act = btn.dataset.act, id = btn.dataset.id ? (isNaN(btn.dataset.id)? btn.dataset.id : Number(btn.dataset.id)) : null;
  const D = state.data;

  switch(act){
    /* --- création --- */
    case "new-projet":     formProjet(); break;
    case "new-commande":   formCommande(); break;
    case "new-livraison":  formLivraison(); break;
    case "new-paiement":   formPaiement(); break;
    case "new-prestation": formPrestation(); break;
    case "new-depense":    formDepense(); break;

    /* --- projets --- */
    case "select-projet":  state.projetId = id; localStorage.setItem("cp-projet", String(id)); render();
                           toast("Projet actif : "+((D.projects.find(p=>p.id===id)||{}).nomProjet||"")); break;
    case "edit-projet":    formProjet(D.projects.find(p=>p.id===id)); break;
    case "archive-projet": { const p = D.projects.find(x=>x.id===id); if(p){ p.statut="Archivé"; await dbPut("projects",p); await refresh(); toast("Projet archivé."); } break; }
    case "del-projet":
      confirmDelete("Supprimer ce projet ET toutes ses commandes, livraisons, paiements, prestations et dépenses ?", async ()=>{
        for(const s of ["orders","deliveries","payments","services","expenses"])
          for(const row of state.data[s].filter(r=>r.projetId===id)) await dbDel(s,row.id);
        await dbDel("projects",id); await refresh(); toast("Projet supprimé.");
      }); break;

    /* --- commandes --- */
    case "toggle-commande":{ const f=state.filters.commandes; f.open = f.open===id? null : id; render(); break; }
    case "edit-commande":  formCommande(D.orders.find(o=>o.id===id)); break;
    case "pay-commande":   { const o=D.orders.find(x=>x.id===id); formPaiement(null,{type:"Fournisseur",referenceId:o.id,projetId:o.projetId,beneficiaire:o.fournisseur}); break; }
    case "deliver-commande":{ const o=D.orders.find(x=>x.id===id); formLivraison(null,o.id); break; }
    case "del-commande":
      confirmDelete("Supprimer cette commande et ses livraisons associées ?", async ()=>{
        for(const l of state.data.deliveries.filter(d=>d.commandeId===id)) await dbDel("deliveries",l.id);
        await dbDel("orders",id); await refresh(); toast("Commande supprimée.");
      }); break;

    /* --- livraisons --- */
    case "edit-livraison": formLivraison(D.deliveries.find(x=>x.id===id)); break;
    case "del-livraison":  confirmDelete(null, async ()=>{ await dbDel("deliveries",id); await refresh(); toast("Livraison supprimée."); }); break;

    /* --- paiements --- */
    case "edit-paiement":  formPaiement(D.payments.find(x=>x.id===id)); break;
    case "del-paiement":   confirmDelete(null, async ()=>{ await dbDel("payments",id); await refresh(); toast("Paiement supprimé."); }); break;

    /* --- prestations --- */
    case "edit-prestation":formPrestation(D.services.find(x=>x.id===id)); break;
    case "pay-prestation": { const s=D.services.find(x=>x.id===id); formPaiement(null,{type:"Prestation",referenceId:s.id,projetId:s.projetId,beneficiaire:s.prestataire||s.designation}); break; }
    case "del-prestation": confirmDelete(null, async ()=>{ await dbDel("services",id); await refresh(); toast("Prestation supprimée."); }); break;

    /* --- dépenses --- */
    case "edit-depense":   formDepense(D.expenses.find(x=>x.id===id)); break;
    case "del-depense":    confirmDelete(null, async ()=>{ await dbDel("expenses",id); await refresh(); toast("Dépense supprimée."); }); break;

    /* --- filtres / divers --- */
    case "reset-filters":  state.filters[state.route] = undefined; render(); toast("Filtres réinitialisés."); break;
    case "print":          window.print(); break;

    /* --- import / export --- */
    case "exp-json": { const e=(state.filters.io||{entity:"orders"}).entity; download("chantier-"+e+".json", JSON.stringify(scope()[e]||state.data[e],null,2),"application/json"); toast("Export JSON généré."); break; }
    case "exp-csv":  { const e=(state.filters.io||{entity:"orders"}).entity; download("chantier-"+e+".csv", toCSV(scope()[e]||[]),"text/csv"); toast("Export CSV généré."); break; }
    case "exp-xls":  { const e=(state.filters.io||{entity:"orders"}).entity; download("chantier-"+e+".xls","\uFEFF"+toCSV(scope()[e]||[]),"application/vnd.ms-excel"); toast("Export Excel généré."); break; }
    case "backup":   exportBackup(); break;

    /* --- apparence & données --- */
    case "set-theme":  applyTheme(String(id),null); render(); break;
    case "set-accent": applyTheme(null,String(id)); render(); break;
    case "demo":       loadDemo(); break;
    case "wipe":       confirmDelete("Effacer TOUTES les données des 6 tables ? Exportez une sauvegarde au préalable.", async ()=>{
                          for(const s of STORES) await dbClear(s); state.projetId=null; await refresh(); toast("Toutes les données ont été effacées."); }); break;
  }
});

/* Champs de filtres (data-f="page.champ") */
document.addEventListener("input", (ev)=>{
  const el = ev.target;
  if(el.dataset && el.dataset.f){
    const [page,key] = el.dataset.f.split(".");
    state.filters[page] = state.filters[page] || {};
    state.filters[page][key] = el.value;
    if(el.tagName==="INPUT" && el.type!=="date"){ clearTimeout(el._t); el._t=setTimeout(()=>{ render(); focusFilter(el.dataset.f); },220); }
    else render();
    if(el.type==="date" || el.tagName==="SELECT") focusFilter(el.dataset.f);
  }
  if(el.id==="search"){
    const res = globalSearch(el.value), box = $("#results");
    if(!res.length){ box.classList.add("hidden"); box.innerHTML=""; return; }
    box.classList.remove("hidden");
    box.innerHTML = res.map(r=>'<button data-goto="'+r.r+'"><small>'+esc(r.c)+'</small><span>'+esc(r.t)+'</span><i>'+esc(r.s)+'</i></button>').join("");
  }
});

  }
  if(ev.target.id==="restoreFile" && ev.target.files[0]){ handleRestoreFile(ev.target.files[0]); ev.target.value=""; }
  if(ev.target.id==="paramProject"){
    state.projetId = ev.target.value==="all"? null : Number(ev.target.value);
    localStorage.setItem("cp-projet", ev.target.value); render();
  }
});

/* -------------------------------- Démarrage -------------------------------- */
(async function start(){
  initTheme();
  if(localStorage.getItem("cp-mini")==="1" && innerWidth>1024) sidebar().classList.add("mini");
  const saved = localStorage.getItem("cp-projet");
  await loadAll();
  if(saved && saved!=="all" && state.data.projects.some(p=>p.id===Number(saved))) state.projetId = Number(saved);
  route();               // L'application démarre VIDE : aucune donnée n'est créée automatiquement.
})();
</script>
</body>
</html>
